<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Avengers Initiative personnel file - Vegiraju Mahaveer Varma, AI and ML Student, Developer, Open-Source Contributor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#1a0a10"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#7df3ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f6bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2f6bff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <rect x="0" y="-70" width="1000" height="70" fill="url(#scan)">
    <animate attributeName="y" from="-70" to="300" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- top classification bar -->
  <rect x="0" y="0" width="1000" height="26" fill="#e23636" opacity="0.92"/>
  <text x="20" y="18" font-family="'Courier New',monospace" font-size="13" fill="#fff" letter-spacing="4" font-weight="700">AVENGERS INITIATIVE  //  PERSONNEL FILE  //  CLEARANCE: LEVEL 7</text>
  <text x="980" y="18" text-anchor="end" font-family="'Courier New',monospace" font-size="13" fill="#fff" letter-spacing="3">STATUS: ACTIVE</text>

  <!-- reactor + orbiting team -->
  <g transform="translate(150,165)">
    <circle r="100" fill="url(#core)" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#glow)">
      <circle r="92" fill="none" stroke="#2f6bff" stroke-width="2" stroke-dasharray="3 9" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle r="66" fill="none" stroke="#e23636" stroke-width="3" stroke-dasharray="55 18 10 18" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="46" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="4 6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="18" fill="#fff">
        <animate attributeName="r" values="15;20;15" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- six orbiting team members -->
      <g>
        <circle cx="0" cy="-92" r="7" fill="#e23636"/>
        <circle cx="79.7" cy="-46" r="7" fill="#2f6bff"/>
        <circle cx="79.7" cy="46" r="7" fill="#f5c542"/>
        <circle cx="0" cy="92" r="7" fill="#3ddc84"/>
        <circle cx="-79.7" cy="46" r="7" fill="#9b5cff"/>
        <circle cx="-79.7" cy="-46" r="7" fill="#00e5ff"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="310" y="88" font-family="'Courier New',monospace" font-size="14" fill="#7da8ff" letter-spacing="4">CODENAME: BUILDER</text>
    <text x="310" y="145" font-size="42" font-weight="800" fill="url(#title)" letter-spacing="1" filter="url(#glow)">VEGIRAJU MAHAVEER VARMA</text>
    <text x="310" y="184" font-size="19" fill="#f5c542" letter-spacing="2">AI &amp; ML STUDENT  |  DEVELOPER  |  OPEN-SOURCE</text>
    <text x="310" y="224" font-family="'Courier New',monospace" font-size="15" fill="#aab9d0">Curious mind. Relentless builder. Open-source believer.</text>
    <text x="310" y="256" font-family="'Courier New',monospace" font-size="20" fill="#e23636" letter-spacing="6" font-weight="700">ASSEMBLE<tspan fill="#fff">_</tspan>
      <animate attributeName="opacity" values="1;1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="none" stroke="#2f6bff" stroke-width="2" opacity="0.85">
    <path d="M12 44V36H40"/><path d="M960 36H988V44"/>
    <path d="M12 262V288H40"/><path d="M988 262V288H960"/>
  </g>
  <rect x="0" y="296" width="1000" height="4" fill="#2f6bff" opacity="0.9"/>
</svg>
