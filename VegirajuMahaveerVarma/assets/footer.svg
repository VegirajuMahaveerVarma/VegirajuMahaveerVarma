<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b13"/><stop offset="0.5" stop-color="#0f3d3a"/><stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="100"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; font-size: 20px; fill: #4de0c7; animation: fade 3s ease-in-out infinite; }
    .w { animation: drift 10s linear infinite; }
    @keyframes fade { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  </style>
  <rect width="1000" height="100" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <path class="w" d="M0 25 Q100 5 200 25 T400 25 T600 25 T800 25 T1000 25 T1200 25 T1400 25 V0 H0 Z" fill="#4de0c7" opacity="0.15"/>
  </g>
  <text class="t" x="500" y="62">Thanks for stopping by ✨</text>
</svg>
